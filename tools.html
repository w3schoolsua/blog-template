<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Генерація RSS і sitemap</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/css/base.css">
    <link rel="stylesheet" href="assets/css/theme.css">
    <script defer src="assets/js/theme.js"></script>
    <script defer src="assets/js/generator.js"></script>
</head>
<body>
<header class="site-header">
    <div class="logo">
        <img src="assets/img/logo.svg" alt="Мій Сайт">
    </div>
    <nav class="main-nav">
        <a href="index.html">Головна</a>
    </nav>
    <button id="themeToggle" class="theme-toggle">🌙</button>
</header>

<main class="content">
    <h1>Генерація RSS та sitemap</h1>
    <p>Натисни кнопку, щоб згенерувати XML на основі <code>articles.json</code>. Потім скопіюй і встав у файли <code>rss.xml</code> та <code>sitemap.xml</code>.</p>

    <button id="genBtn">Згенерувати</button>

    <h2>RSS</h2>
    <textarea id="rssOut" rows="12" style="width:100%;"></textarea>

    <h2>sitemap.xml</h2>
    <textarea id="sitemapOut" rows="12" style="width:100%;"></textarea>
</main>

<footer class="site-footer">© 2025 Мій сайт публікацій</footer>
</body>
</html>
