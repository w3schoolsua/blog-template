  <!--Скрипт - автоматичне визначення теми за системою-->
  <script>
    (function() {
      const saved = localStorage.getItem("theme");
      if (saved) {
        document.documentElement.setAttribute("data-theme", saved);
        return;
      }
      // Автоматична системна тема
      const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.setAttribute("data-theme", prefersDark ? "dark" : "light");
    })();
  </script>
  <!-- Плавне завантаження сторінки -->

    body {opacity: 0;transition: opacity .35s ease}

<!-- Бургер-меню -->
<script>
  document.addEventListener("DOMContentLoaded", () => {
    const burger = document.getElementById("burgerBtn");
    const nav = document.getElementById("mainNav");

    burger.addEventListener("click", () => {
      const isOpen = burger.classList.toggle("open");
      nav.classList.toggle("nav-open", isOpen);
    });
  });
</script>

<!-- Плавне завантаження -->
<script>
  window.addEventListener("load", () => {
    document.body.classList.add("page-loaded");
  });
</script>

<!-- Кнопка підняття вгору -->
<button id="scrollTopBtn" class="scroll-top-btn" title="Нагору">↑</button>

<!-- Скрипт для кнопки підняття вгору -->
<script>
  document.addEventListener("DOMContentLoaded", () => {
    const scrollBtn = document.getElementById("scrollTopBtn");

    window.addEventListener("scroll", () => {
      if (window.scrollY > 300) {
        scrollBtn.classList.add("show");
      } else {
        scrollBtn.classList.remove("show");
      }
    });

    scrollBtn.addEventListener("click", () => {
      window.scrollTo({ top: 0, behavior: "smooth" });
    });
  });
</script>
