<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Головна — Мій сайт публікацій</title>
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/theme.css">
  <script defer src="assets/js/theme.js"></script>
  <script defer src="assets/js/year.js"></script>
  <script defer src="assets/js/core.js"></script>
  <script defer src="assets/js/posts.js"></script>
  <script defer src="assets/js/archive-blk.js"></script>
  <script defer src="assets/js/sidebar.js"></script>
  <script defer src="assets/js/render.js"></script>
  <script>
    // Ініціалізація головної сторінки
    document.addEventListener("DOMContentLoaded", async () => {
      await loadCMSData();

      // Роки в сайдбарі (на головній активний рік не обов'язковий)
      renderYearSidebar(null);

      // Беремо останні публікації з усіх категорій:
      const latestGeneral = POSTS.getLatest(10);
      const latestArchive = ARCHIVE_BLK.getLatest(10);

      // Об'єднуємо, сортуємо, беремо 10
      const all = latestGeneral.concat(latestArchive)
              .sort((a, b) => new Date(b.date) - new Date(a.date))
              .slice(0, 10);

      renderPostList(all, "mainContent");
    });
  </script>
  <script>
    // Скрипт - автоматичне визначення теми за системою
    (function() {
      const saved = localStorage.getItem("theme");
      if (saved) {
        document.documentElement.setAttribute("data-theme", saved);
        return;
      }
      // Автоматична системна тема
      const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.setAttribute("data-theme", prefersDark ? "dark" : "light");
    })();
  </script>
  <style>
    body {opacity: 0;transition: opacity .35s ease}
    body.page-loaded {opacity: 1}
  </style>
</head>

<body>

<header class="top-header">
  <button class="burger-btn" id="burgerBtn" aria-label="Меню">
    <span></span>
    <span></span>
    <span></span>
  </button>

  <a href="index.html" class="logo-block">
    <img src="img/logo.svg" class="logo-img" alt="Logo">
    <span class="site-title">Мій сайт публікацій</span>
  </a>
  <button id="themeToggle" class="theme-toggle">🌙</button>
</header>

<nav class="main-nav" id="mainNav">
  <a href="index.html">Головна</a>
  <a href="category-archive.html">Архів БЛК</a>
  <a href="category-news.html">Новини</a>
  <a href="category-articles.html">Статті</a>
  <a href="category-video.html">Відео</a>
  <a href="category-photo.html">Фото</a>
  <a href="category-ads.html">Оголошення</a>
  <a href="about.html">Про сайт</a>
</nav>

<div class="archive-layout">

  <!-- Лівий сайдбар: роки -->
  <aside class="archive-sidebar">
    <h1>Роки</h1>
    <div id="yearsSidebar"></div>
  </aside>

  <!-- Центр: 10 останніх публікацій -->
  <main class="archive-content">
    <h2>Останні публікації</h2>
    <div id="mainContent"></div>
  </main>

</div>

<footer class="site-footer">
  © <span id="yearRange"></span> Шаблон сайту. Усі права захищені.<br>
  <a href="license.html" class="license-link">Ліцензія</a> / <a href="contacts.html" class="footer-link">Контакти</a>
  <span id="updatedInfo"></span>
</footer>

<script>
  document.addEventListener("DOMContentLoaded", () => {
    const burger = document.getElementById("burgerBtn");
    const nav = document.getElementById("mainNav");

    burger.addEventListener("click", () => {
      const isOpen = burger.classList.toggle("open");
      nav.classList.toggle("nav-open", isOpen);
    });
  });
</script>
<script>
  window.addEventListener("load", () => {
    document.body.classList.add("page-loaded");
  });
</script>
</body>
</html>
