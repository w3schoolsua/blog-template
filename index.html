<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Мій сайт публікацій</title>
    <meta name="description" content="Публікації, статті та матеріали в хронологічному порядку.">

    <!-- Правильний canonical для GitHub Pages -->
    <link rel="canonical" href="https://username.github.io/repository/">

    <!-- ✔ Підключення стилів -->
    <link rel="stylesheet" href="assets/css/base.css">
    <link rel="stylesheet" href="assets/css/theme.css">

    <!-- ✔ Підключення JS -->
    <script defer src="assets/js/theme.js"></script>
    <script defer src="assets/js/menu.js"></script>
    <script defer src="assets/js/seo.js"></script>
    <script defer src="assets/js/year.js"></script>
</head>

<body>

<!-- ВЕРХНЯ ПАНЕЛЬ (ЛОГО + ТЕМА) -->
<header class="top-header">

    <!-- Логотип + назва сайту (клікабельні) -->
    <a href="index.html" class="logo-block">
        <img src="assets/img/logo.svg" alt="Logo" class="logo-img">
        <span class="site-title">Blog Template</span>
    </a>

    <!-- Перемикач теми -->
    <button id="themeToggle" class="theme-toggle">🌙</button>
</header>
<!-- ===========================
     ГОЛОВНЕ МЕНЮ (СТИКИ)
=========================== -->
<nav class="main-nav sticky-nav">
    <!-- Головна -->
    <a href="index.html">Головна</a>

    <!-- Категорії -->
    <a href="category-archive-blk.html">Архів БЛК</a>
    <a href="category-news.html">Новини</a>
    <a href="category-articles.html">Статті</a>
    <a href="category-video.html">Відео</a>
    <a href="category-photo.html">Фото</a>
    <a href="category-announcements.html">Оголошення</a>

    <!-- Про сайт -->
    <a href="about.html">Про сайт</a>
</nav>

<!-- ОСНОВНИЙ КОНТЕНТ -->
<main class="content">

    <!-- ✔ Фільтри (категорії + пошук) -->
    <div class="filters">

        <!-- Категорії -->
        <!-- label тут не потрібен, бо select має свій placeholder -->
        <select id="categoryFilter">
            <option value="">Усі категорії</option>
        </select>

        <!-- Пошук -->
        <input id="searchInput" class="search" placeholder="Пошук статей...">
    </div>

    <!-- Заголовок -->
    <h1>Останні публікації</h1>

    <!-- ✔ Список статей (сюди menu.js вставляє HTML) -->
    <div id="articlesList" class="articles-list"></div>

    <!-- ✔ Пагінація -->
    <div id="pagination" class="pagination"></div>

</main>

<footer class="site-footer">
    © <span id="yearRange"></span> Мій сайт публікацій.
    Усі права захищені.
    <a href="license.html" class="license-link">Ліцензія</a>
    <a href="contacts.html" class="footer-link">Контакти</a>
    <span id="updatedInfo"></span>
</footer>

</body>
</html>
