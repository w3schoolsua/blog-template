<!DOCTYPE html>
<html lang="uk" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Архів БЛК</title>

    <!-- Плавне завантаження сторінки -->
    <style>
        body { opacity: 0; transition: opacity .35s ease; }
        body.page-loaded { opacity: 1; }
    </style>

    <!-- Автоматичне визначення теми -->
    <script>
        (function() {
            const saved = localStorage.getItem("theme");
            if (saved) {
                document.documentElement.setAttribute("data-theme", saved);
                return;
            }
            const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
            document.documentElement.setAttribute("data-theme", prefersDark ? "dark" : "light");
        })();
    </script>

    <!-- CSS -->
    <link rel="stylesheet" href="assets/css/theme.css">
    <link rel="stylesheet" href="assets/css/base.css">

    <!-- Автоматичний рік у футері -->
    <script defer src="assets/js/year.js"></script>

    <!-- Модулі CMS -->
    <script defer src="assets/js/core.js"></script>
    <script defer src="assets/js/posts.js"></script>
    <script defer src="assets/js/archive-blk.js"></script>
    <script defer src="assets/js/sidebar.js"></script>
    <script defer src="assets/js/render.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            await loadCMSData();

            const params = new URLSearchParams(window.location.search);
            let year = parseInt(params.get("year"), 10);

            const years = ARCHIVE_BLK.getYears();
            if (!years.length) return;

            if (!year || !years.includes(year)) {
                year = years[0];
            }

            renderYearSidebar(year);

            const posts = ARCHIVE_BLK.getByYear(year);
            renderPostList(posts, "archiveContent");
        });
    </script>
</head>

<body>

<header class="top-header">
    <button class="burger-btn" id="burgerBtn">
        <span></span>
        <span></span>
        <span></span>
    </button>

    <a href="index.html" class="logo-block">
        <img src="img/logo.svg" class="logo-img" alt="Logo">
        <span class="site-title">Мій сайт публікацій</span>
    </a>
    <button id="themeToggle" class="theme-toggle">🌙</button>
</header>

<nav class="main-nav" id="mainNav">
    <a href="index.html">Головна</a>
    <a href="category-archive.html" class="active">Архів БЛК</a>
    <a href="category-news.html">Новини</a>
    <a href="category-articles.html">Статті</a>
    <a href="category-video.html">Відео</a>
    <a href="category-photo.html">Фото</a>
    <a href="category-ads.html">Оголошення</a>
    <a href="about.html">Про сайт</a>
</nav>

<div class="archive-layout">

    <!-- Лівий сайдбар: роки -->
    <aside class="archive-sidebar">
        <h1>Архів БЛК — роки</h1>
        <div id="yearsSidebar"></div>
    </aside>

    <!-- Центр: публікації Архіву БЛК за рік -->
    <main class="archive-content">
        <h2>Публікації за обраний рік</h2>
        <div id="archiveContent"></div>
    </main>

</div>

<footer class="site-footer">
    © <span id="yearRange"></span> Шаблон сайту. Усі права захищені.<br>
    <a href="license.html" class="license-link">Ліцензія</a> / <a href="contacts.html" class="footer-link">Контакти</a>
    <span id="updatedInfo"></span>
</footer>

<!-- Плавне завантаження -->
<script>
    window.addEventListener("load", () => {
        document.body.classList.add("page-loaded");
    });
</script>

<!-- Перемикач теми -->
<script src="assets/js/theme.js"></script>

<!-- Бургер-меню -->
<script>
    document.addEventListener("DOMContentLoaded", () => {
        const burger = document.getElementById("burgerBtn");
        const nav = document.getElementById("mainNav");

        burger.addEventListener("click", () => {
            const isOpen = burger.classList.toggle("open");
            nav.classList.toggle("nav-open", isOpen);
        });
    });
</script>

</body>
</html>
